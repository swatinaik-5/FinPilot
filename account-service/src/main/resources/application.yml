spring:
  application:
    name: account-service

  datasource:
    url: ${ACCOUNT_DB_URL}
    username: ${ACCOUNT_DB_USER}
    password: ${ACCOUNT_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ACCOUNT_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
